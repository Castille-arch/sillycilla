<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Silly Cilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage">
    <h1 class="title">🎉 SILLY CILLA 🎉</h1>
    <p class="subtitle">Inte direkt skarpaste kniven i lådan, men herregud vad hon kan dansa.</p>

    <div class="dance-floor">
      <div class="disco-light"></div>

      <svg class="dancer" id="dancer" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="faceClipCilla">
            <circle cx="100" cy="48" r="42" />
          </clipPath>
        </defs>
        <g class="rig">
          <line class="limb arm-left" x1="100" y1="100" x2="55" y2="150" />
          <line class="limb arm-right" x1="100" y1="100" x2="145" y2="150" />
          <line class="limb leg-left" x1="100" y1="190" x2="65" y2="255" />
          <line class="limb leg-right" x1="100" y1="190" x2="135" y2="255" />
          <line class="limb spine" x1="100" y1="100" x2="100" y2="190" />
          <circle class="halo" cx="100" cy="48" r="46" />
          <image
            class="face"
            href="cecilia.png"
            x="58" y="6" width="84" height="84"
            clip-path="url(#faceClipCilla)"
            preserveAspectRatio="xMidYMid slice"
          />
        </g>
      </svg>

      <svg class="dancer dancer-me" id="dancer2" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="faceClipMe">
            <circle cx="100" cy="48" r="42" />
          </clipPath>
        </defs>
        <g class="rig">
          <line class="limb arm-left" x1="100" y1="100" x2="55" y2="150" />
          <line class="limb arm-right" x1="100" y1="100" x2="145" y2="150" />
          <line class="limb leg-left" x1="100" y1="190" x2="65" y2="255" />
          <line class="limb leg-right" x1="100" y1="190" x2="135" y2="255" />
          <line class="limb spine" x1="100" y1="100" x2="100" y2="190" />
          <circle class="halo" cx="100" cy="48" r="46" />
          <image
            class="face"
            href="me.png"
            x="58" y="6" width="84" height="84"
            clip-path="url(#faceClipMe)"
            preserveAspectRatio="xMidYMid slice"
          />
        </g>
      </svg>
    </div>

    <div class="controls">
      <button id="playBtn">▶️ Kör låten</button>
      <button id="stopBtn">⏹️ Nu räcker det, Cecilia</button>
    </div>

    <div class="player-wrap">
      <div id="ytplayer"></div>
    </div>

    <div class="caption-box">
      <p id="caption">Tryck på knappen. Cecilia går inte att stoppa. Vetenskapen har försökt.</p>
    </div>

    <footer>
      Gjort med kärlek, usel CSS och noll rytmkänsla — till Cecilia 💃
    </footer>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
